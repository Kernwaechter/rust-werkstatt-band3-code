[workspace]
resolver = "2"
members = [
    "teil-01-erstes-spielfenster",
    "teil-02-steuerung-vektoren",
    "teil-03-laser-entities",
    "teil-04-kollision-partikel",
    "teil-05-hud-gameloop",
    "teil-06-isometrische-welt",
    "teil-07-kacheln-raeume",
    "teil-08-gegner-kampf",
    "teil-09-storytelling-dialoge",
    "teil-10-sound-kamera",
    "teil-11-dreidimensionale-welt",
    "teil-12-physik-hindernisse",
    "teil-13-plugins-architektur-tests",
    "teil-14-spielstaende-persistenz",
    "teil-15-release-packaging",
]

[workspace.dependencies]
bevy = { version = "0.15", default-features = false, features = [
    "bevy_asset",
    "bevy_audio",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_gizmos",
    "bevy_pbr",
    "bevy_render",
    "bevy_scene",
    "bevy_sprite",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_window",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "png",
    "wav",
    "x11",
    "tonemapping_luts",
] }
serde = { version = "1.0", features = ["derive"] }
ron = "0.8"
rand = "0.8"
directories = "5"
